name: Print gateway release

on:
  push:
    tags:
      - 'print-gateway-v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-22.04
    env:
      AIRPOS_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      AIRPOS_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up .NET for official Star converter
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build official StarPRNT converter
        run: |
          git clone --depth 1 --branch v2.0.1 https://github.com/star-micronics/cloudprnt-sdk.git /tmp/star-cloudprnt-sdk
          dotnet publish /tmp/star-cloudprnt-sdk/CloudPRNTSDKSamples/cputil/cputil.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:PublishSingleFile=true --output /tmp/star-cputil
          test -x /tmp/star-cputil/cputil

      - name: Install package build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig python3-pil shellcheck

      - name: Resolve build font
        run: |
          font_source="$(fc-match -f '%{file}\n' 'Noto Sans CJK JP' | head -n 1)"
          test -f "$font_source" || {
            echo '::error::Noto Sans CJK font not found.'
            exit 1
          }
          printf 'AIRPOS_BITMAP_FONT=%s\n' "$font_source" >> "$GITHUB_ENV"

      - name: Validate release settings
        run: |
          test -n "$AIRPOS_SUPABASE_URL" || {
            echo '::error::Repository variable VITE_SUPABASE_URL is missing.'
            exit 1
          }
          test -n "$AIRPOS_SUPABASE_ANON_KEY" || {
            echo '::error::Repository secret VITE_SUPABASE_ANON_KEY is missing.'
            exit 1
          }

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run check && npm run build

      - name: Test headless core
        working-directory: core
        run: dart pub get && dart analyze lib bin test && dart test

      - name: Build Debian package
        working-directory: .
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#print-gateway-v}"
          ./packaging/build-deb.sh "$version" --font "$AIRPOS_BITMAP_FONT" --star-cputil /tmp/star-cputil/cputil
          cp "dist/airpos-print-gateway_${version}_amd64.deb" dist/airpos-print-gateway_amd64.deb
          (cd dist && sha256sum airpos-print-gateway_amd64.deb > SHA256SUMS)

      - name: Validate package
        working-directory: .
        run: |
          font_zip="$(mktemp)"
          trap 'rm -f "$font_zip"' EXIT
          dpkg-deb --info dist/airpos-print-gateway_amd64.deb
          dpkg-deb --contents dist/airpos-print-gateway_amd64.deb
          dpkg-deb --contents dist/airpos-print-gateway_amd64.deb | grep -F '/opt/airpos-print-gateway/airpos_print_gatewayd'
          dpkg-deb --contents dist/airpos-print-gateway_amd64.deb | grep -F '/opt/airpos-print-gateway/web/index.html'
          dpkg-deb --contents dist/airpos-print-gateway_amd64.deb | grep -F '/opt/airpos-print-gateway/bin/cputil'
          dpkg-deb --contents dist/airpos-print-gateway_amd64.deb | grep -F '/opt/airpos-print-gateway/fonts/airpos-unicode.fnt.zip'
          dpkg-deb --contents dist/airpos-print-gateway_amd64.deb | grep -F 'airpos-print-gateway.service'
          dpkg-deb --fsys-tarfile dist/airpos-print-gateway_amd64.deb | tar -xOf - ./opt/airpos-print-gateway/fonts/airpos-unicode.fnt.zip > "$font_zip"
          python3 packaging/generate_bitmap_font.py --output "$font_zip" --validate-only
          file build/airpos_print_gatewayd | grep -E 'ELF 64-bit.*x86-64'
          grep -aF -- "$AIRPOS_SUPABASE_URL" build/airpos_print_gatewayd >/dev/null
          grep -aF -- "$AIRPOS_SUPABASE_ANON_KEY" build/airpos_print_gatewayd >/dev/null
          (cd dist && sha256sum --check SHA256SUMS)
          bash -n packaging/install.sh packaging/build-deb.sh packaging/postinst packaging/prerm packaging/postrm

      - name: ShellCheck packaging
        working-directory: .
        run: shellcheck packaging/*.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh release create "${{ github.ref_name }}" dist/airpos-print-gateway_amd64.deb dist/SHA256SUMS --generate-notes
